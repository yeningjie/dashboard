<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>消费记账数据看板</title>
  <!-- 在线CDN，不需要电脑里有libs文件夹，联网即可 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .chart-box { height: 350px; }
    #status { display: none; }
    .card-highlight { background-color: #e1edff; border-color: #428bca; }
  </style>
</head>
<body class="container py-4">
  <header>
    <h1 class="h3">个人消费记录看板</h1>
    <p class="text-muted" id="sub-title"></p >
  </header>

  <p id="status" class="alert alert-warning"></p >

  <section class="row g-3 mb-4" id="cards"></section>

  <section class="row g-3">
    <div class="col-lg-6">
      <h2 class="h5">消费分类占比（ECharts饼图）</h2>
      <div id="pie-chart" class="chart-box"></div>
    </div>
    <div class="col-lg-6">
      <h2 class="h5">月度消费趋势（Chart.js折线图）</h2>
      <div class="chart-box">
        <canvas id="trend-chart"></canvas>
      </div>
    </div>
  </section>

  <!-- CDN在线引入，不需要本地libs -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
